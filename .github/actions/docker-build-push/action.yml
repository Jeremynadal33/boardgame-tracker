name: "Docker build and push"
description: "Build the application image and push it to GHCR"

inputs:
  tags:
    description: "Image tags to push, space separated (e.g. '1.2.3 latest')"
    required: true
  dry_run:
    description: "Build only, do not push"
    required: false
    default: "false"

runs:
  using: "composite"
  steps:
    - name: Compute image references
      id: image
      shell: bash
      run: |
        IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"
        REFS=""
        for TAG in ${{ inputs.tags }}; do
          REFS="${REFS}${IMAGE}:${TAG}"$'\n'
        done
        {
          echo "refs<<EOF"
          printf '%s' "$REFS"
          echo "EOF"
        } >> "$GITHUB_OUTPUT"

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to GHCR
      if: ${{ inputs.dry_run != 'true' }}
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ github.token }}

    - name: Build and push
      uses: docker/build-push-action@v6
      with:
        context: .
        push: ${{ inputs.dry_run != 'true' }}
        tags: ${{ steps.image.outputs.refs }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Create summary
      shell: bash
      run: |
        {
          if [ "${{ inputs.dry_run }}" == "true" ]; then
            echo "🔍 **Dry run mode** - Image built but not pushed"
          else
            echo "# 🐳 Image pushed"
          fi
          echo ""
          echo "${{ steps.image.outputs.refs }}" | sed 's/.*/- `&`/'
        } >> "$GITHUB_STEP_SUMMARY"
