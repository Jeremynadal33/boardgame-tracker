name: Release snapshot

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (build only, no push)"
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Same scheme as pdm-backend "guess-next-dev": <next patch>.dev<commits since tag>+g<sha>
      # '+' is not allowed in a Docker tag, so it is replaced by '-'.
      - name: Compute snapshot version
        id: version
        run: |
          LAST_TAG=$(git describe --tags --abbrev=0 --match 'v[0-9]*.[0-9]*.[0-9]*' 2>/dev/null || true)
          if [ -n "$LAST_TAG" ]; then
            BASE="${LAST_TAG#v}"
            DISTANCE=$(git rev-list --count "${LAST_TAG}..HEAD")
          else
            BASE="0.0.0"
            DISTANCE=$(git rev-list --count HEAD)
          fi
          IFS=. read -r MAJOR MINOR PATCH <<< "$BASE"
          VERSION="${MAJOR}.${MINOR}.$((PATCH + 1)).dev${DISTANCE}+g$(git rev-parse --short HEAD)"
          echo "Detected version: $VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "docker_tag=${VERSION//+/-}" >> "$GITHUB_OUTPUT"

      - name: Build and push image
        uses: ./.github/actions/docker-build-push
        with:
          tags: ${{ steps.version.outputs.docker_tag }}
          dry_run: ${{ inputs.dry_run }}
