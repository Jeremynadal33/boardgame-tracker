name: CI

on:
  pull_request:
    branches: [master]


concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true


jobs:
  backend_changes:
    runs-on: ubuntu-latest
    outputs:
      run_tests: ${{ steps.check_changes.outputs.changed }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          clean: 'false'

      - name: Check for backend changes
        id: check_changes
        uses: ./.github/actions/check-folder-changes
        with:
          folder: backend

  backend-lint:
    runs-on: ubuntu-latest
    needs: backend_changes
    if: needs.backend_changes.outputs.run_tests == 'true'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          clean: 'false'

      - name: Install uv
        uses: ./.github/actions/install_uv
    
      - name: Run ruff linting
        run: |
          uv --version
          echo "## 🔍 Ruff Linting Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          # Check linting and capture exit code
          if uv run ruff check --diff --output-format=github; then
            echo "✅ **Linting**: No issues found" >> $GITHUB_STEP_SUMMARY
            LINT_EXIT=0
          else
            echo "❌ **Linting**: Issues found (see annotations above)" >> $GITHUB_STEP_SUMMARY
            LINT_EXIT=1
          fi
          
          echo "" >> $GITHUB_STEP_SUMMARY
          
          # Check formatting and capture exit code
          if uv run ruff format --check --diff; then
            echo "✅ **Formatting**: Code is properly formatted" >> $GITHUB_STEP_SUMMARY
            FORMAT_EXIT=0
          else
            echo "❌ **Formatting**: Code formatting issues found" >> $GITHUB_STEP_SUMMARY
            FORMAT_EXIT=1
          fi
          
          # Exit with failure if either check failed
          if [ $LINT_EXIT -ne 0 ] || [ $FORMAT_EXIT -ne 0 ]; then
            exit 1
          fi
        working-directory: backend
    
  backend-test:
    runs-on: ubuntu-latest
    needs: backend_changes
    if: needs.backend_changes.outputs.run_tests == 'true'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          clean: 'false'

      - name: Install uv
        uses: ./.github/actions/install_uv
      
      - name: Run backend tests
        run: |
          echo "## 🧪 Backend Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          # Run tests with proper uv environment and capture result
          if uv run pytest --junitxml=backend/test-results.xml; then
            echo "✅ **Tests**: All tests passed" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ **Tests**: Some tests failed (see details above)" >> $GITHUB_STEP_SUMMARY
            exit 1
          fi
        working-directory: backend

  frontend_changes:
    runs-on: ubuntu-latest
    outputs:
      run_tests: ${{ steps.check_changes.outputs.changed }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          clean: 'false'

      - name: Check for frontend changes
        id: check_changes
        uses: ./.github/actions/check-folder-changes
        with:
          folder: frontend

  frontend-test:
    runs-on: ubuntu-latest
    needs: frontend_changes
    if: needs.frontend_changes.outputs.run_tests == 'true'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      - name: Type-check and build
        run: npm run build
        working-directory: frontend

      - name: Run frontend tests
        run: npm run test:ci
        working-directory: frontend

  docker-build:
    runs-on: ubuntu-latest
    needs: [backend_changes, frontend_changes]
    if: needs.backend_changes.outputs.run_tests == 'true' || needs.frontend_changes.outputs.run_tests == 'true'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build image
        uses: ./.github/actions/docker-build-push
        with:
          tags: ci
          dry_run: 'true'
