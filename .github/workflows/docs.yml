name: Docs

on:
  push:
    branches: [master]
    paths:
      - "docs/**"
      - "backend/docs/**"
      - "frontend/docs/**"
      - "mkdocs.yml"
      - "backend/mkdocs.yml"
      - "frontend/mkdocs.yml"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; let a running one finish rather than leave Pages half published
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: ./.github/actions/install_uv
        with:
          uv_version: "0.12.1"
          cache_dependency_glob: uv.lock
          python_version_file: .python-version

      - name: Build the documentation
        run: uv run --group docs mkdocs build --strict

      - name: Upload the site
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
