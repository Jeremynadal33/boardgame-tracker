[project]
name = "boardgame-tracker-backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "bcrypt==4.3.0", # keep this version because ongoing issue on password length https://foss.heptapod.net/python-libs/passlib/-/issues/196
    "fastapi[standard]>=0.125.0",
    "passlib>=1.7.4",
    "pydantic-settings>=2.12.0",
    "pyjwt>=2.10.1",
    "sqlmodel>=0.0.27",
    "tenacity>=9.1.2",
]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-cov==4.1.0",
]

[tool.uv]
package = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = [
    "--cov=boardgame_tracker_backend",
    "--cov-report=term-missing",
    "--strict-markers",
    "--strict-config",
    "-v",
    "-s",
]